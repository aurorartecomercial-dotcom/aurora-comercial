<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog - Aurora Comercial</title>
    <meta name="description" content="Blog da Aurora Comercial - dicas de moda, tecnologia e muito mais." />
    <meta name="keywords" content="aurora, comercial, blog, angola, moda, tecnologia" />
    <meta property="og:title" content="Blog - Aurora Comercial" />
    <meta property="og:description" content="Artigos e novidades da Aurora Comercial." />
    <meta property="og:image" content="https://i.ibb.co/5g8cSd4j/IPHONE-ROSA.jpg" />
    <meta property="og:url" content="https://aurorartecomercial-dotcom.github.io/aurora-comercial/blog.html" />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css?v=3" />

    <!-- ESTILOS EXCLUSIVOS DO BLOG -->
    <style>
        body.blog-page { background: #0f0f0f; color: #f0f0f0; }
        .pagina-blog { background: #0f0f0f; padding: 30px 24px; border-radius: 24px; }
        .pagina-blog h1 { color: #00d4ff !important; font-size: 2.8rem; text-align: center; margin-bottom: 20px; position: relative; }
        .pagina-blog h1::after { content: ''; display: block; width: 80px; height: 3px; background: #8b5cf6; margin: 10px auto 0; }
        #blogGrid .produto-card { background: #1a1a1a; border-radius: 20px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.8); border: 1px solid #333; color: #f0f0f0; transition: 0.3s; }
        #blogGrid .produto-card:hover { border-color: #00d4ff; box-shadow: 0 10px 30px rgba(0, 212, 255, 0.2); transform: translateY(-4px); }
        #blogGrid .produto-imagem { background: #222; }
        #blogGrid .produto-info h3 { color: #ffffff; }
        #blogGrid .produto-info p { color: #a0a0a0; }
        #blogGrid .categoria-tag { color: #8b5cf6 !important; }
        #blogGrid .produto-info span:last-child { color: #00d4ff !important; }
        #blogGrid .produto-info span:last-child:hover { color: #8b5cf6 !important; }
        .breadcrumb { color: #888; }
        .breadcrumb a { color: #00d4ff; }
        .breadcrumb a:hover { color: #8b5cf6; }
    </style>
</head>
<body class="blog-page">
    <header class="header-principal" role="banner">
        <div class="header-top">
            <a href="index.html" class="logo" aria-label="Voltar para a página inicial">
                <img src="logo auro.png" alt="Logo Aurora Comercial" />
                <span>Aurora<br /><span>Comercial</span></span>
            </a>
            <form class="busca-container" role="search" onsubmit="event.preventDefault();">
                <input type="search" id="campoBusca" placeholder="Buscar produtos..." class="busca-input" />
                <button type="submit">🔍</button>
            </form>
            <div class="header-icones">
                <button class="btn-entrar" id="btnEntrar">
                    <small>Olá, faça seu login</small>
                    Conta
                </button>
                <button id="abrirCarrinhoFlutuante" class="carrinho-icone">
                    🛒 <span id="badgeContador">0</span>
                </button>
            </div>
        </div>
        <nav class="menu-categorias">
            <ul id="menuCategorias">
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#?cat=eletronicos">Eletrônicos</a></li>
                <li><a href="index.html#?cat=consolas">Consolas</a></li>
                <li><a href="blog.html" class="ativo" style="color:var(--cor-ouro);">📖 Blog</a></li>
            </ul>
        </nav>
    </header>

    <main style="max-width:1480px; margin: 20px auto; padding: 0 24px;">
        <div class="pagina-blog">
            <h1>📖 Blog Aurora Comercial</h1>
            <div id="blogGrid" class="grade-produtos" style="grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));"></div>
        </div>
    </main>

    <footer class="rodape-profissional">
        <div class="rodape-copyright">&copy; 2026 AURORARTE COMERCIAL.</div>
    </footer>

    <script type="module" src="js/blog.js?v=3"></script>
</body>
</html>
