<!DOCTYPE html>
<html>
<head>
    <title>Criar Bin de Vendas</title>
</head>
<body>
    <h2 style="color: #005A4C;">✅ Criador Automático de BIN (Vendas)</h2>
    <p>Aguarde... O sistema está a criar o bin para si.</p>
    <div id="resultado"></div>

    <script>
        // Dados da sua conta JSONbin (já estão no seu config.js)
        const MASTER_KEY = '$2a$10$hF6Ctf0zhHdWGCY/1OsoJeuXfh9jtYTl3cL.ZmZwNBluOD7t8eKc6';
        // O ID da sua coleção "Vendas" (aquele que apareceu na sua foto)
        const COLLECTION_ID = '6a71ad69da38895dfeb77617'; 

        async function criarBin() {
            try {
                const resposta = await fetch('https://api.jsonbin.io/v3/b', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': MASTER_KEY
                    },
                    body: JSON.stringify({
                        name: 'historico_vendas',
                        collectionId: COLLECTION_ID,
                        record: [] // O conteúdo vazio
                    })
                });

                if (!resposta.ok) {
                    throw new Error('Erro ao criar bin: ' + resposta.status);
                }

                const dados = await resposta.json();
                const binID = dados.metadata.id; // Pega o ID gerado

                document.getElementById('resultado').innerHTML = `
                    <div style="background: #d4edda; padding: 20px; border-radius: 8px; margin-top: 20px; border: 1px solid #c3e6cb;">
                        <h3 style="color: #155724; margin: 0;">🎉 BIN CRIADO COM SUCESSO!</h3>
                        <p style="font-size: 16px;">Copie o ID abaixo e cole no seu <code>js/config.js</code>:</p>
                        <h1 style="background: #fff; padding: 15px; border: 2px dashed #005A4C; border-radius: 5px; font-size: 24px; color: #005A4C; word-break: break-all;">
                            ${binID}
                        </h1>
                        <p>Vá no seu arquivo <code>js/config.js</code>, procure <code>BIN_ID_VENDAS</code> e substitua pelo código acima.</p>
                    </div>
                `;
            } catch (erro) {
                document.getElementById('resultado').innerHTML = `
                    <div style="background: #f8d7da; padding: 20px; border-radius: 8px; margin-top: 20px; border: 1px solid #f5c6cb; color: #721c24;">
                        <h3>❌ Erro ao criar o bin.</h3>
                        <p>${erro.message}</p>
                        <p>Pode ser que a sua Coleção "Vendas" já tenha um bin com este nome. Apague o que tem lá e tente novamente.</p>
                    </div>
                `;
            }
        }

        // Executa o script automaticamente ao abrir a página
        criarBin();
    </script>
</body>
</html>
